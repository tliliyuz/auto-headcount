name: auto-headcount

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_headcount}
      POSTGRES_USER: ${POSTGRES_USER:-auto_headcount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ./apps/web
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_headcount}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-auto_headcount}
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./apps/web/db:/app/db
      - ./apps/web/drizzle:/app/drizzle

  web:
    build:
      context: ./apps/web
      target: development
    env_file:
      - path: ./.env.local
        required: false
      - path: ./apps/web/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_headcount}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-auto_headcount}
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/db:/app/db
      - ./apps/web/drizzle:/app/drizzle
      - ./apps/web/fixtures:/app/fixtures
      - ./apps/web/lib:/app/lib
      - ./apps/web/scripts:/app/scripts
      - ./apps/web/tests:/app/tests
      - web_node_modules_bookworm:/app/node_modules

volumes:
  postgres_data:
  web_node_modules_bookworm:
