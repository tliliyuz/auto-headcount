name: auto-headcount

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_headcount}
      POSTGRES_USER: ${POSTGRES_USER:-auto_headcount}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_headcount}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-auto_headcount}
    command: npm run db:migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./apps/web/db:/app/db
      - ./apps/web/drizzle:/app/drizzle

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    env_file:
      - path: ./.env.local
        required: false
      - path: ./apps/web/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_headcount}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-auto_headcount}
    command: npm run dev -- --hostname 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./apps/web/app:/app/app
      - ./apps/web/db:/app/db
      - ./apps/web/drizzle:/app/drizzle
      - ./apps/web/fixtures:/app/fixtures
      - ./apps/web/lib:/app/lib
      - ./apps/web/scripts:/app/scripts
      - ./apps/web/tests:/app/tests
      - ./docs/contracts:/docs/contracts:ro
      - web_node_modules_bookworm:/app/node_modules

  # 本地定时同步调度：每 15 分钟跑一轮任务表 tick（入队周期同步 + 处理到期任务，
  # 含页面「同步职位」按钮入队的立即任务）。env 来自 .env.local（MCP 凭证/加密 key）。
  scheduler:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    env_file:
      - path: ./.env.local
        required: false
      - path: ./apps/web/.env.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auto_headcount}:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/${POSTGRES_DB:-auto_headcount}
      # dev 无已批准 LLM 适配器：默认关闭自动匹配，避免共享 dev DB 每周期出现
      # LLM_ADAPTER_NOT_CONFIGURED 失败任务并干扰集成测试；需要联调自动匹配时显式设 true。
      MATCH_AUTOMATION_ENABLED: ${MATCH_AUTOMATION_ENABLED:-false}
    command: node scripts/run-scheduled-tick.mjs --loop --interval-minutes 1
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/web/lib:/app/lib
      - ./apps/web/scripts:/app/scripts
      - ./apps/web/db:/app/db
      - ./apps/web/drizzle:/app/drizzle
      - ./docs/contracts:/docs/contracts:ro
      - web_node_modules_bookworm:/app/node_modules

volumes:
  postgres_data:
  web_node_modules_bookworm:
